name: Build binaries

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  integration:
    # A release publishes nothing until the integration suite passes at the
    # tagged commit.
    uses: ./.github/workflows/integration.yml

  binaries:
    name: Build release binaries
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archives
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: make dist

      - name: Verify Linux archive
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          tar -tzf "dist/cinc_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "dist/cinc_${VERSION}_linux_amd64.tar.gz" -C /tmp
          "/tmp/cinc_${VERSION}_linux_amd64/cinc" version

      - name: Publish GitHub release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
