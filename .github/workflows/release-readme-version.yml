name: Update README version on release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-readme:
    name: Bump README install version
    # Skip prereleases — the README should advertise the latest stable
    # install, not a -rc/-beta tag.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      # Fail fast with a clear message when the token has expired or been
      # revoked. Otherwise checkout fails with git's unhelpful
      # "could not read Username for 'https://github.com'".
      - name: Check DOCS_BOT_TOKEN
        env:
          TOKEN: ${{ secrets.DOCS_BOT_TOKEN }}
        run: |
          fix="Create a new PAT (contents: write on ${GITHUB_REPOSITORY}) for an account on main's branch-protection bypass list and save it as the DOCS_BOT_TOKEN repository secret."
          if [[ -z "$TOKEN" ]]; then
            echo "::error::DOCS_BOT_TOKEN isn't set. ${fix}"
            exit 1
          fi
          if ! push=$(GH_TOKEN="$TOKEN" gh api "repos/${GITHUB_REPOSITORY}" --jq .permissions.push 2>&1); then
            echo "::error::GitHub rejected DOCS_BOT_TOKEN (${push}). It has probably expired or been revoked. ${fix}"
            exit 1
          fi
          if [[ "$push" != "true" ]]; then
            echo "::error::DOCS_BOT_TOKEN works but can't push to ${GITHUB_REPOSITORY}. ${fix}"
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Update main itself, not the release tag's commit.
          ref: main
          # DOCS_BOT_TOKEN is a PAT (or GitHub App token) whose owner is on
          # main's branch-protection bypass list — the same token docs.yml
          # uses, because the default GITHUB_TOKEN cannot push to main.
          # SECURITY FOLLOW-UP: migrate this branch-protection-bypass
          # credential to a repo-scoped GitHub App installation token
          # (short-lived, least-privilege) instead of a long-lived PAT.
          # Needs a maintainer to provision the App; kept as-is for now so
          # CI keeps working until that's in place.
          token: ${{ secrets.DOCS_BOT_TOKEN }}

      - name: Update CINC_VERSION in README
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          # Rewrite the pinned CINC_VERSION in the GitHub Actions install
          # snippet to the just-released tag. The anchor (`^<spaces>CINC_VERSION:`)
          # only matches the env: line, never the ${CINC_VERSION} usages below it.
          sed -i -E "s/^([[:space:]]*CINC_VERSION:[[:space:]]*).*/\1${VERSION}/" README.md

      - name: Commit if changed
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          # No-op when the README already advertises this version, so a
          # re-run (or a release with no version change) never pushes.
          if [[ -z "$(git status --porcelain README.md)" ]]; then
            echo "README install version already ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README install version to ${VERSION}"
          git push
