name: Update generated docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate docs/commands
    runs-on: ubuntu-latest
    steps:
      # Fail fast with a clear message when the token has expired or been
      # revoked. Otherwise checkout fails with git's unhelpful
      # "could not read Username for 'https://github.com'".
      - name: Check DOCS_BOT_TOKEN
        env:
          TOKEN: ${{ secrets.DOCS_BOT_TOKEN }}
        run: |
          fix="Create a new PAT (contents: write on ${GITHUB_REPOSITORY}) for an account on main's branch-protection bypass list and save it as the DOCS_BOT_TOKEN repository secret."
          if [[ -z "$TOKEN" ]]; then
            echo "::error::DOCS_BOT_TOKEN isn't set. ${fix}"
            exit 1
          fi
          if ! push=$(GH_TOKEN="$TOKEN" gh api "repos/${GITHUB_REPOSITORY}" --jq .permissions.push 2>&1); then
            echo "::error::GitHub rejected DOCS_BOT_TOKEN (${push}). It has probably expired or been revoked. ${fix}"
            exit 1
          fi
          if [[ "$push" != "true" ]]; then
            echo "::error::DOCS_BOT_TOKEN works but can't push to ${GITHUB_REPOSITORY}. ${fix}"
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # DOCS_BOT_TOKEN is a PAT (or GitHub App token) whose owner is
          # on main's branch-protection bypass list. The default
          # GITHUB_TOKEN cannot push to main because branch protection
          # requires status checks it can't satisfy from this workflow.
          # SECURITY FOLLOW-UP: this branch-protection-bypass credential
          # should migrate to a repo-scoped GitHub App installation token
          # (short-lived, least-privilege) rather than a long-lived PAT.
          # That requires a maintainer to provision the App and store its
          # credentials; left as-is here to avoid breaking CI in the meantime.
          token: ${{ secrets.DOCS_BOT_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate docs
        run: make docs

      # The "Commit if changed" step is a no-op when docs/commands
      # already matches the cobra command tree, so a clean run never
      # produces a push. A push made by this workflow re-triggers
      # docs.yml, but the follow-up run finds a clean tree and exits
      # without pushing, so the loop terminates after one extra
      # no-op run.
      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain docs/commands)" ]]; then
            echo "docs/commands already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/commands
          git commit -m "Regenerate docs/commands from cobra command tree"
          git push
