# Dependabot keeps Go module and GitHub Actions dependencies up to date.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Go module dependencies (go.mod at the repository root).
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"

  # The integration suite's module, which pins cinc-server-ng.
  - package-ecosystem: gomod
    directory: "/integration"
    schedule:
      interval: weekly
    groups:
      integration-dependencies:
        patterns:
          - "*"

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
