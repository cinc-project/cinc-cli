# Dependabot keeps Go module and GitHub Actions dependencies up to date.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Go module dependencies (go.mod at the repository root).
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"
    ignore:
      # pflag 1.1.0 renders every bool flag as `--flag[=true|false]` in
      # help output (no opt-out), changing every `cinc ... --help` screen
      # and docs/commands. Held at 1.0.10 until we decide to adopt it.
      - dependency-name: github.com/spf13/pflag
        versions: [">= 1.1.0"]

  # The integration suite's module, which pins cinc-server-ng.
  - package-ecosystem: gomod
    directory: "/integration"
    schedule:
      interval: weekly
    groups:
      integration-dependencies:
        patterns:
          - "*"
    ignore:
      # Held with the root module; see the pflag note above.
      - dependency-name: github.com/spf13/pflag
        versions: [">= 1.1.0"]

  # Providers of the cinc-server-erlang Terraform stack.
  - package-ecosystem: terraform
    directory: "/integration/terraform"
    schedule:
      interval: weekly

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
